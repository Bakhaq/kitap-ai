{% extends "base.html" %}
{% block title %}Тіркелу — Kitap.AI{% endblock %}
{% block content %}
<div class="box auth">
    <h2>Тіркелу</h2>
    <p class="muted"><span class="req">*</span> — міндетті өрістер</p>
    <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="full_name">Аты-жөні <span class="req">*</span></label>
        <input id="full_name" name="full_name" maxlength="120" required autocomplete="name" value="{{ form.full_name }}">
        <label for="email">Email <span class="req">*</span></label>
        <input id="email" name="email" type="email" maxlength="160" required autocomplete="email" value="{{ form.email }}">
        <label for="password">Пароль (кемінде 8 таңба) <span class="req">*</span></label>
        <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
        <label for="password2">Парольді растау <span class="req">*</span></label>
        <input id="password2" name="password2" type="password" minlength="8" required autocomplete="new-password">
        <p><button type="submit" style="width:100%">Тіркелу</button></p>
    </form>
    <p>Аккаунтыңыз бар ма? <a href="{{ url_for('login') }}">Кіру</a></p>
</div>
{% endblock %}
