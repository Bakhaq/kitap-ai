{% extends "base.html" %}
{% block title %}Кіру — Kitap.AI{% endblock %}
{% block content %}
<div class="box auth">
    <h2>Кіру</h2>
    <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="email">Email <span class="req">*</span></label>
        <input id="email" name="email" type="email" required autocomplete="email" value="{{ email }}">
        <label for="password">Пароль <span class="req">*</span></label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
        <p><button type="submit" style="width:100%">Кіру</button></p>
    </form>
    <p>Аккаунтыңыз жоқ па? <a href="{{ url_for('register') }}">Тіркелу</a></p>
</div>
{% endblock %}
