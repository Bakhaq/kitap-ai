<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" role="img" aria-label="Ашық кітап, құлаққап және жұлдыздар">
  <!-- фон: жұмсақ шеңбер -->
  <circle cx="220" cy="180" r="160" fill="#ffffff" opacity="0.10"/>
  <circle cx="220" cy="180" r="118" fill="#ffffff" opacity="0.08"/>

  <!-- кітап сөресі (артқы кітаптар) -->
  <g transform="translate(70 70)">
    <rect x="0"  y="40" width="26" height="120" rx="3" fill="#e8a33d"/>
    <rect x="30" y="20" width="22" height="140" rx="3" fill="#f6d28b"/>
    <rect x="56" y="55" width="28" height="105" rx="3" fill="#cfe6e3"/>
    <rect x="4"  y="60" width="18" height="4" fill="#0f5257" opacity=".5"/>
    <rect x="34" y="40" width="14" height="4" fill="#0f5257" opacity=".5"/>
    <rect x="60" y="75" width="20" height="4" fill="#0f5257" opacity=".5"/>
  </g>

  <!-- ашық кітап -->
  <g transform="translate(120 170)">
    <path d="M100 30 C 70 10, 25 8, 0 18 L 0 128 C 25 118, 70 120, 100 140 Z" fill="#ffffff"/>
    <path d="M100 30 C 130 10, 175 8, 200 18 L 200 128 C 175 118, 130 120, 100 140 Z" fill="#f4f1ea"/>
    <path d="M100 30 L 100 140" stroke="#d9d3c4" stroke-width="2"/>
    <path d="M-8 26 L -8 138 C 30 126, 70 128, 100 148 C 130 128, 170 126, 208 138 L 208 26"
          fill="none" stroke="#e8a33d" stroke-width="6" stroke-linejoin="round"/>
    <!-- мәтін жолдары -->
    <g stroke="#b9c9c6" stroke-width="4" stroke-linecap="round">
      <line x1="18" y1="42" x2="82" y2="48"/>
      <line x1="18" y1="58" x2="82" y2="63"/>
      <line x1="18" y1="74" x2="70" y2="78"/>
      <line x1="18" y1="90" x2="82" y2="95"/>
      <line x1="118" y1="48" x2="182" y2="42"/>
      <line x1="118" y1="63" x2="182" y2="58"/>
      <line x1="118" y1="78" x2="170" y2="74"/>
    </g>
    <!-- дыбыс толқыны (аудиокітап) -->
    <g fill="#0f5257">
      <rect x="120" y="96"  width="6" height="14" rx="3"/>
      <rect x="132" y="90"  width="6" height="26" rx="3"/>
      <rect x="144" y="94"  width="6" height="18" rx="3"/>
      <rect x="156" y="86"  width="6" height="34" rx="3"/>
      <rect x="168" y="95"  width="6" height="16" rx="3"/>
    </g>
  </g>

  <!-- құлаққап -->
  <g transform="translate(255 40)" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round">
    <path d="M10 95 C 10 25, 120 25, 120 95"/>
    <rect x="-4" y="88" width="28" height="48" rx="12" fill="#e8a33d" stroke="none"/>
    <rect x="106" y="88" width="28" height="48" rx="12" fill="#e8a33d" stroke="none"/>
  </g>

  <!-- жұлдыздар (AI ұсыныстары) -->
  <g fill="#f6d28b">
    <path d="M190 60 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/>
    <path d="M360 200 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
    <path d="M60 250 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
  </g>
  <circle cx="390" cy="120" r="5" fill="#ffffff" opacity=".7"/>
  <circle cx="45"  cy="150" r="4" fill="#ffffff" opacity=".6"/>
  <circle cx="330" cy="300" r="6" fill="#ffffff" opacity=".5"/>
</svg>
