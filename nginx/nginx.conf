# Kitap.AI — Nginx: TLS аяқтау, reverse proxy, static және жүктемені бөлу (round robin)
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Әр сұрау қай upstream данасына кеткенін журналда көрсету
    log_format upstream_log '$remote_addr $host $request '
                            'status=$status upstream=$upstream_addr '
                            'response=$upstream_response_time';
    access_log /var/log/nginx/access.log upstream_log;
    error_log  /var/log/nginx/error.log warn;

    # Екі web данасы бір топта. Әдепкі алгоритм — round robin.
    # max_fails / fail_timeout: 2 рет қате берген дана 10 секундқа уақытша шығарылады.
    upstream web_cluster {
        server web:5000         max_fails=2 fail_timeout=10s;
        server web_replica:5000 max_fails=2 fail_timeout=10s;
        keepalive 16;
    }

    # HTTP: тек healthcheck және HTTPS-ке қайта бағыттау
    server {
        listen 80;
        server_name lab.local;

        location = /nginx-health { return 200 "nginx ok\n"; }
        location / { return 301 https://$host$request_uri; }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name lab.local;

        ssl_certificate     /etc/nginx/certs/lab.local.crt;
        ssl_certificate_key /etc/nginx/certs/lab.local.key;
        ssl_protocols       TLSv1.2 TLSv1.3;          # TLS 1.0 және 1.1 өшірулі
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Статикалық файлдарды Flask-сыз, Nginx тікелей береді
        location /static/ {
            alias /srv/static/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location = /nginx-health { return 200 "nginx ok\n"; }

        location / {
            proxy_pass http://web_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";               # keepalive үшін
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout    30s;
            # Бір дана жауап бермесе, сұрау келесі данаға қайта жіберіледі
            proxy_next_upstream error timeout http_502 http_503;
            # Тексеру үшін: жауап берген дана жауап тақырыбында көрінеді
            add_header X-Upstream $upstream_addr always;
        }
    }
}
