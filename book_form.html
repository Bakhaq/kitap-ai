{% extends "base.html" %}
{% block title %}Кітапты өңдеу — Әкімші панелі{% endblock %}
{% block content %}
{% include "admin/_nav.html" %}
<div class="box">
    <h2 style="margin-top:0">Кітапты өңдеу (id = {{ form.id }})</h2>
    <form method="post" action="{{ url_for('admin_book_edit', bid=form.id) }}" novalidate>
        {% include "admin/_book_fields.html" %}
        <p><button type="submit">Өзгерістерді сақтау</button>
           <a class="btn btn-light" href="{{ url_for('admin_books') }}">Бас тарту</a></p>
    </form>
</div>
{% endblock %}
