<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="grid2">
    <div>
        <label for="name">Кеңсе атауы <span class="req">*</span></label>
        <input id="name" name="name" maxlength="120" required value="{{ form.name or '' }}">
    </div>
    <div>
        <label for="address">Мекенжай (қоғамдық орын, үй мекенжайы емес) <span class="req">*</span></label>
        <input id="address" name="address" maxlength="240" required value="{{ form.address or '' }}">
    </div>
    <div>
        <label for="latitude">Ендік (latitude) <span class="req">*</span></label>
        <input id="latitude" name="latitude" inputmode="decimal" required placeholder="51.159800" value="{{ form.latitude if form.latitude is not none else '' }}">
    </div>
    <div>
        <label for="longitude">Бойлық (longitude) <span class="req">*</span></label>
        <input id="longitude" name="longitude" inputmode="decimal" required placeholder="71.471400" value="{{ form.longitude if form.longitude is not none else '' }}">
    </div>
    <div>
        <label for="phone">Телефон</label>
        <input id="phone" name="phone" maxlength="40" value="{{ form.phone or '' }}">
    </div>
    <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" maxlength="160" value="{{ form.email or '' }}">
    </div>
</div>
