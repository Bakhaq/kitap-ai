{% block content %}

<div class="box">
    <h2 style="margin-top:0">Кеңсені өңдеу (id = {{ form.id }})</h2>
    <form method="post" action="{{ url_for('admin_office_edit', oid=form.id) }}" novalidate>

</div>
{% endblock %}
