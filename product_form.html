{% extends "base.html" %}
{% block title %}Өнімді өңдеу — Әкімші панелі{% endblock %}
{% block content %}
{% include "admin/_nav.html" %}
<div class="box">
    <h2 style="margin-top:0">Өнімді өңдеу (id = {{ form.id }})</h2>
    <form method="post" action="{{ url_for('admin_product_edit', pid=form.id) }}" novalidate>
        {% include "admin/_product_fields.html" %}
        <p><button type="submit">Өзгерістерді сақтау</button>
           <a class="btn btn-light" href="{{ url_for('admin_products') }}">Бас тарту</a></p>
    </form>
</div>
{% endblock %}
